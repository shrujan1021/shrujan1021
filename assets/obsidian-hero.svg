<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" width="1920" height="640" role="img" aria-label="OBSIDIAN DIGITAL SYSTEMS — chrome sculptural forms under electric blue studio lighting">
  <defs>
    <!-- ============ GRADIENTS ============ -->
    <linearGradient id="chromeFront" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#EDF1F6"/>
      <stop offset="0.16" stop-color="#C6CCD6"/>
      <stop offset="0.34" stop-color="#8F97A4"/>
      <stop offset="0.48" stop-color="#5C6371"/>
      <stop offset="0.60" stop-color="#A9B1BD"/>
      <stop offset="0.74" stop-color="#6A717E"/>
      <stop offset="0.88" stop-color="#9AA2AF"/>
      <stop offset="1" stop-color="#565D6A"/>
    </linearGradient>
    <linearGradient id="chromeFront2" x1="0.1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3E8EF"/>
      <stop offset="0.22" stop-color="#B4BBC7"/>
      <stop offset="0.45" stop-color="#767E8C"/>
      <stop offset="0.58" stop-color="#4E5563"/>
      <stop offset="0.72" stop-color="#98A0AD"/>
      <stop offset="1" stop-color="#4B5260"/>
    </linearGradient>
    <linearGradient id="chromeFace3" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#DCE2EA"/>
      <stop offset="0.3" stop-color="#9DA5B2"/>
      <stop offset="0.52" stop-color="#616875"/>
      <stop offset="0.66" stop-color="#AAB2BF"/>
      <stop offset="1" stop-color="#5A616E"/>
    </linearGradient>
    <linearGradient id="chromeSide" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#3A404C"/>
      <stop offset="0.45" stop-color="#232833"/>
      <stop offset="1" stop-color="#171B24"/>
    </linearGradient>
    <linearGradient id="chromeSide2" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#454C59"/>
      <stop offset="0.5" stop-color="#2A303B"/>
      <stop offset="1" stop-color="#1B2029"/>
    </linearGradient>
    <linearGradient id="chromeTop" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FAFBFD"/>
      <stop offset="0.5" stop-color="#D3D9E2"/>
      <stop offset="1" stop-color="#A6AEBA"/>
    </linearGradient>
    <linearGradient id="chromeTopDim" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#C9CFD9"/>
      <stop offset="0.55" stop-color="#98A0AC"/>
      <stop offset="1" stop-color="#6E7583"/>
    </linearGradient>
    <linearGradient id="ringChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6FA"/>
      <stop offset="0.28" stop-color="#B9C0CB"/>
      <stop offset="0.52" stop-color="#6B7280"/>
      <stop offset="0.70" stop-color="#C6CCD6"/>
      <stop offset="1" stop-color="#4E5560"/>
    </linearGradient>
    <linearGradient id="ringChromeFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7EBF1"/>
      <stop offset="0.35" stop-color="#9BA3B0"/>
      <stop offset="0.62" stop-color="#59606D"/>
      <stop offset="1" stop-color="#2A303B"/>
    </linearGradient>
    <radialGradient id="sphereChrome" cx="0.34" cy="0.28" r="0.95">
      <stop offset="0" stop-color="#F5F7FA"/>
      <stop offset="0.18" stop-color="#D5DAE2"/>
      <stop offset="0.42" stop-color="#939BA8"/>
      <stop offset="0.62" stop-color="#5A616E"/>
      <stop offset="0.80" stop-color="#2C313C"/>
      <stop offset="1" stop-color="#141821"/>
    </radialGradient>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="0.45" stop-color="#11141B"/>
      <stop offset="1" stop-color="#151922"/>
    </linearGradient>
    <radialGradient id="focalHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1D2431" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#151A24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0B0D12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueHaze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1677FF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#1677FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1677FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueHaze2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1677FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1677FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141822"/>
      <stop offset="0.25" stop-color="#0F121A"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="beamWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F5F8" stop-opacity="0.075"/>
      <stop offset="0.6" stop-color="#F3F5F8" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#F3F5F8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1677FF" stop-opacity="0.12"/>
      <stop offset="0.65" stop-color="#1677FF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#1677FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="horizonStreak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1677FF" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#1677FF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#5AA9FF" stop-opacity="0.75"/>
      <stop offset="0.72" stop-color="#1677FF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#1677FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignetteGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.42"/>
      <stop offset="0.18" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </linearGradient>
    <radialGradient id="vignetteSide" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="reflectFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C6CCD6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflectFadeBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1677FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1677FF" stop-opacity="0"/>
    </linearGradient>

    <!-- ============ FILTERS ============ -->
    <filter id="blurMid" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blurSmall" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="blurBeam" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="softGlowBlue" x="-120%" y="-400%" width="340%" height="900%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.78  0 0 0 0 0.80  0 0 0 0 0.84  0 0 0 0.05 0"/>
    </filter>
    <filter id="contactShadow" x="-80%" y="-260%" width="260%" height="620%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="1920" height="640" fill="url(#bgGlow)"/>
  <ellipse cx="1220" cy="285" rx="640" ry="400" fill="url(#focalHalo)"/>
  <ellipse cx="1380" cy="330" rx="430" ry="290" fill="url(#blueHaze)"/>
  <ellipse cx="700" cy="380" rx="260" ry="160" fill="url(#blueHaze2)"/>

  <!-- studio beams -->
  <g filter="url(#blurBeam)">
    <polygon points="240,-40 560,-40 -120,660 -420,660" fill="url(#beamWhite)"/>
    <polygon points="1080,-40 1180,-40 1560,660 1380,660" fill="url(#beamBlue)"/>
  </g>

  <!-- ============ FLOOR ============ -->
  <rect x="0" y="430" width="1920" height="210" fill="url(#floorGrad)"/>
  <rect x="0" y="429" width="1920" height="1.2" fill="#232A36" opacity="0.9"/>
  <rect x="0" y="428" width="1920" height="7" fill="url(#horizonStreak)" filter="url(#softGlowBlue)" opacity="0.8"/>
  <rect x="0" y="429.6" width="1920" height="1.4" fill="url(#horizonStreak)"/>

  <!-- ============ LEFT SPHERE ============ -->
  <ellipse cx="722" cy="462" rx="78" ry="17" fill="url(#reflectFade)" filter="url(#blurMid)" opacity="0.8"/>
  <ellipse cx="722" cy="432" rx="64" ry="8" fill="#05070B" opacity="0.85" filter="url(#contactShadow)"/>
  <g>
    <circle cx="722" cy="358" r="70" fill="url(#sphereChrome)"/>
    <ellipse cx="696" cy="328" rx="20" ry="11" fill="#FFFFFF" opacity="0.5" filter="url(#blurSmall)" transform="rotate(-24 696 328)"/>
    <ellipse cx="688" cy="318" rx="8" ry="4.5" fill="#FFFFFF" opacity="0.75" transform="rotate(-24 688 318)"/>
    <path d="M 774 322 A 70 70 0 0 1 748 418" fill="none" stroke="#1677FF" stroke-width="5" opacity="0.6" filter="url(#blurSmall)"/>
    <path d="M 776 326 A 70 70 0 0 1 752 414" fill="none" stroke="#8CC2FF" stroke-width="1.6" opacity="0.75"/>
    <path d="M 672 402 A 70 70 0 0 0 776 396" fill="none" stroke="#7C8492" stroke-width="4" opacity="0.25" filter="url(#blurSmall)"/>
  </g>

  <!-- ============ RIGHT CUBES ============ -->
  <ellipse cx="1638" cy="448" rx="86" ry="13" fill="url(#reflectFade)" filter="url(#blurMid)" opacity="0.7"/>
  <ellipse cx="1638" cy="434" rx="74" ry="7" fill="#05070B" opacity="0.8" filter="url(#contactShadow)"/>
  <g>
    <polygon points="1552,368 1578,356 1622,356 1596,368" fill="url(#chromeTopDim)"/>
    <polygon points="1596,368 1622,356 1622,406 1596,418" fill="#1A1F29"/>
    <rect x="1552" y="368" width="44" height="50" fill="#232833"/>
    <rect x="1593.4" y="368" width="2.2" height="50" fill="#1677FF" opacity="0.4"/>
  </g>
  <g>
    <polygon points="1598,362 1626,348 1682,348 1654,362" fill="url(#chromeTop)"/>
    <polygon points="1654,362 1682,348 1682,410 1654,424" fill="url(#chromeSide)"/>
    <rect x="1598" y="362" width="56" height="62" fill="url(#chromeFace3)"/>
    <rect x="1651.6" y="362" width="2.4" height="62" fill="#1677FF" opacity="0.55"/>
    <rect x="1598" y="362" width="56" height="1.6" fill="#F3F5F8" opacity="0.55"/>
  </g>

  <!-- ============ MONOLITH ============ -->
  <rect x="1120" y="432" width="200" height="90" fill="url(#reflectFade)" filter="url(#blurMid)" opacity="0.75"/>
  <ellipse cx="1210" cy="436" rx="140" ry="9" fill="#05070B" opacity="0.9" filter="url(#contactShadow)"/>

  <!-- ring: back arc -->
  <g transform="rotate(-14 1210 300)">
    <path d="M 1005 300 A 205 60 0 0 1 1415 300" fill="none" stroke="url(#ringChrome)" stroke-width="17" stroke-linecap="round"/>
    <path d="M 1005 300 A 205 60 0 0 1 1415 300" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.55" transform="translate(0,-5.5)"/>
    <path d="M 1005 300 A 205 60 0 0 1 1415 300" fill="none" stroke="#1677FF" stroke-width="2" stroke-linecap="round" opacity="0.7" transform="translate(0,6)"/>
  </g>

  <!-- pedestal (x 1136-1284, y 372-424) -->
  <g>
    <polygon points="1136,372 1284,372 1310,360 1162,360" fill="url(#chromeTop)"/>
    <polygon points="1284,372 1310,360 1310,412 1284,424" fill="url(#chromeSide)"/>
    <rect x="1136" y="372" width="148" height="52" fill="url(#chromeFront2)"/>
    <rect x="1281.5" y="372" width="2.5" height="52" fill="#1677FF" opacity="0.5"/>
    <rect x="1136" y="372.5" width="148" height="1.5" fill="#F3F5F8" opacity="0.45"/>
  </g>

  <!-- seam light: pedestal -> seg1 -->
  <rect x="1160" y="365" width="100" height="5" fill="#1677FF" opacity="0.9" filter="url(#softGlowBlue)"/>
  <rect x="1160" y="366.5" width="100" height="2" fill="#BFDBFF" opacity="1"/>

  <!-- segment 1 (x 1150-1270, y 280-364) -->
  <g>
    <polygon points="1150,280 1270,280 1296,268 1176,268" fill="url(#chromeTop)"/>
    <polygon points="1270,280 1296,268 1296,352 1270,364" fill="url(#chromeSide)"/>
    <rect x="1150" y="280" width="120" height="84" fill="url(#chromeFront)"/>
    <rect x="1267.5" y="280" width="2.5" height="84" fill="#1677FF" opacity="0.55"/>
    <rect x="1150" y="280.5" width="120" height="1.5" fill="#F3F5F8" opacity="0.45"/>
  </g>

  <!-- seam light: seg1 -> seg2 -->
  <rect x="1168" y="271" width="84" height="5" fill="#1677FF" opacity="0.85" filter="url(#softGlowBlue)"/>
  <rect x="1168" y="272.5" width="84" height="2" fill="#BFDBFF" opacity="0.95"/>

  <!-- segment 2 (x 1160-1260, y 200-270) -->
  <g>
    <polygon points="1160,200 1260,200 1286,188 1186,188" fill="url(#chromeTop)"/>
    <polygon points="1260,200 1286,188 1286,258 1260,270" fill="url(#chromeSide2)"/>
    <rect x="1160" y="200" width="100" height="70" fill="url(#chromeFront2)"/>
    <rect x="1257.5" y="200" width="2.5" height="70" fill="#1677FF" opacity="0.5"/>
    <rect x="1160" y="200.5" width="100" height="1.4" fill="#F3F5F8" opacity="0.4"/>
  </g>

  <!-- seam light: seg2 -> seg3 -->
  <rect x="1177" y="191" width="66" height="4.5" fill="#1677FF" opacity="0.8" filter="url(#softGlowBlue)"/>
  <rect x="1177" y="192" width="66" height="1.8" fill="#BFDBFF" opacity="0.9"/>

  <!-- segment 3 (x 1170-1250, y 136-190) -->
  <g>
    <polygon points="1170,136 1250,136 1276,124 1196,124" fill="url(#chromeTop)"/>
    <polygon points="1250,136 1276,124 1276,178 1250,190" fill="url(#chromeSide)"/>
    <rect x="1170" y="136" width="80" height="54" fill="url(#chromeFront)"/>
    <rect x="1247.5" y="136" width="2.5" height="54" fill="#1677FF" opacity="0.55"/>
    <rect x="1170" y="136.5" width="80" height="1.4" fill="#F3F5F8" opacity="0.45"/>
  </g>

  <!-- seam light: seg3 -> crown -->
  <rect x="1192" y="131" width="36" height="4" fill="#1677FF" opacity="0.75" filter="url(#softGlowBlue)"/>
  <rect x="1192" y="131.8" width="36" height="1.6" fill="#BFDBFF" opacity="0.85"/>

  <!-- crown (x 1188-1232, y 110-130) -->
  <ellipse cx="1210" cy="108" rx="46" ry="10" fill="#1677FF" opacity="0.35" filter="url(#blurSmall)"/>
  <g>
    <polygon points="1188,110 1232,110 1258,98 1214,98" fill="url(#chromeTop)"/>
    <polygon points="1232,110 1258,98 1258,118 1232,130" fill="url(#chromeSide2)"/>
    <rect x="1188" y="110" width="44" height="20" fill="url(#chromeFace3)"/>
    <rect x="1229.6" y="110" width="2.4" height="20" fill="#1677FF" opacity="0.6"/>
    <rect x="1188" y="110.5" width="44" height="1.2" fill="#F3F5F8" opacity="0.5"/>
  </g>

  <!-- ring: front arc (over monolith) -->
  <g transform="rotate(-14 1210 300)">
    <path d="M 1415 300 A 205 60 0 0 1 1005 300" fill="none" stroke="url(#ringChromeFront)" stroke-width="17" stroke-linecap="round"/>
    <path d="M 1408 312 A 198 54 0 0 1 1012 312" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.28"/>
    <path d="M 1415 300 A 205 60 0 0 1 1005 300" fill="none" stroke="#0B0D12" stroke-width="1.2" stroke-linecap="round" opacity="0.5" transform="translate(0,7)"/>
  </g>

  <!-- floor accents -->
  <ellipse cx="1210" cy="470" rx="150" ry="12" fill="url(#reflectFadeBlue)" filter="url(#blurMid)" opacity="0.55"/>
  <ellipse cx="722" cy="462" rx="60" ry="9" fill="url(#reflectFadeBlue)" filter="url(#blurMid)" opacity="0.35"/>

  <!-- ============ ATMOSPHERE / FINISH ============ -->
  <rect width="1920" height="640" fill="url(#vignetteSide)"/>
  <rect width="1920" height="640" fill="url(#vignetteGrad)"/>
</svg>
