<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="533" viewBox="0 0 1600 533" role="img" aria-label="Shrujan Mitbavkar — Engineering ideas into reliable software. IT Engineering Student and Software Engineer Intern.">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="hexStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="monoText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="topFace1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="topFace2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="topFace3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="topWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1020" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0B1020" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6D28D9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="0.35" stop-color="#818CF8"/>
      <stop offset="0.75" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </radialGradient>
    <radialGradient id="floorBounce" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="microGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#334155" stroke-width="1" opacity="0.28"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1600" height="533" fill="#0A0E1A"/>
  <rect width="1600" height="533" fill="url(#microGrid)" opacity="0.5"/>
  <rect width="1600" height="140" fill="url(#topWash)"/>

  <!-- ambient light pools -->
  <ellipse cx="1180" cy="180" rx="540" ry="380" fill="url(#glowViolet)"/>
  <ellipse cx="1430" cy="420" rx="430" ry="300" fill="url(#glowBlue)"/>
  <ellipse cx="990" cy="470" rx="320" ry="180" fill="url(#glowCyan)"/>
  <ellipse cx="170" cy="500" rx="380" ry="220" fill="url(#glowViolet)" opacity="0.45"/>

  <!-- perspective floor -->
  <g stroke="#22D3EE" stroke-width="1.4" opacity="0.16">
    <line x1="1000" y1="352" x2="120" y2="533"/>
    <line x1="1000" y1="352" x2="360" y2="533"/>
    <line x1="1000" y1="352" x2="600" y2="533"/>
    <line x1="1000" y1="352" x2="820" y2="533"/>
    <line x1="1000" y1="352" x2="1000" y2="533"/>
    <line x1="1000" y1="352" x2="1180" y2="533"/>
    <line x1="1000" y1="352" x2="1380" y2="533"/>
    <line x1="1000" y1="352" x2="1600" y2="520"/>
    <line x1="1000" y1="352" x2="1600" y2="430"/>
  </g>
  <g stroke="#6366F1" stroke-width="1.2" opacity="0.14">
    <line x1="0" y1="392" x2="1600" y2="392"/>
    <line x1="0" y1="424" x2="1600" y2="424"/>
    <line x1="0" y1="468" x2="1600" y2="468"/>
    <line x1="0" y1="520" x2="1600" y2="520"/>
  </g>
  <rect x="0" y="350" width="1600" height="2.5" fill="url(#ruleGrad)" opacity="0.55"/>

  <!-- stars / particles -->
  <g fill="#E0F2FE">
    <circle cx="560" cy="70" r="1.4" opacity="0.55"/>
    <circle cx="640" cy="120" r="1" opacity="0.4"/>
    <circle cx="760" cy="52" r="1.2" opacity="0.5"/>
    <circle cx="880" cy="96" r="1" opacity="0.35"/>
    <circle cx="990" cy="60" r="1.5" opacity="0.5"/>
    <circle cx="1120" cy="42" r="1" opacity="0.4"/>
    <circle cx="1260" cy="80" r="1.3" opacity="0.45"/>
    <circle cx="1380" cy="48" r="1" opacity="0.35"/>
    <circle cx="1500" cy="100" r="1.4" opacity="0.5"/>
    <circle cx="1540" cy="200" r="1" opacity="0.35"/>
    <circle cx="70" cy="120" r="1.2" opacity="0.4"/>
    <circle cx="250" cy="60" r="1" opacity="0.3"/>
  </g>
  <g fill="#67E8F9">
    <circle cx="820" cy="140" r="2" opacity="0.7"/>
    <circle cx="1450" cy="160" r="2" opacity="0.6"/>
    <circle cx="620" cy="330" r="1.8" opacity="0.5"/>
    <circle cx="1560" cy="330" r="1.8" opacity="0.5"/>
  </g>

  <!-- corner brackets -->
  <g fill="none" stroke="#22D3EE" stroke-width="2.4" opacity="0.45">
    <path d="M28 64V28H64"/>
    <path d="M1536 28H1572V64"/>
    <path d="M1572 469V505H1536"/>
  </g>

  <!-- SM monogram emblem -->
  <g transform="translate(170,268)">
    <circle r="92" fill="#7C3AED" opacity="0.22" filter="url(#bigGlow)"/>
    <polygon points="0,-84 72.7,-42 72.7,42 0,84 -72.7,42 -72.7,-42" fill="#0C1226" fill-opacity="0.85" stroke="url(#hexStroke)" stroke-width="3.2" filter="url(#softGlow)"/>
    <polygon points="0,-64 55.4,-32 55.4,32 0,64 -55.4,32 -55.4,-32" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.7"/>
    <text x="0" y="19" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="4" fill="url(#monoText)" filter="url(#textGlow)">SM</text>
    <g fill="#22D3EE">
      <circle cx="0" cy="-84" r="4.5"/><circle cx="72.7" cy="-42" r="4.5"/>
      <circle cx="72.7" cy="42" r="4.5"/><circle cx="0" cy="84" r="4.5"/>
      <circle cx="-72.7" cy="42" r="4.5"/><circle cx="-72.7" cy="-42" r="4.5"/>
    </g>
  </g>

  <!-- typography -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="290" y="236" font-size="58" font-weight="800" letter-spacing="4" fill="url(#nameGrad)" filter="url(#textGlow)">SHRUJAN MITBAVKAR</text>
    <text x="290" y="288" font-size="30" font-weight="500" fill="#E2E8F0">Engineering ideas into <tspan fill="#67E8F9" font-weight="600">reliable software.</tspan></text>
    <text x="290" y="328" font-size="17.5" font-weight="600" letter-spacing="3.6" fill="#94A3B8">IT ENGINEERING STUDENT · SOFTWARE ENGINEER INTERN</text>
  </g>
  <rect x="290" y="348" width="240" height="3.5" rx="1.75" fill="url(#ruleGrad)"/>
  <rect x="538" y="344.5" width="10" height="10" transform="rotate(45 543 349.5)" fill="#22D3EE"/>

  <!-- orbit rings -->
  <g transform="rotate(-18 1225 250)" fill="none">
    <ellipse cx="1225" cy="250" rx="268" ry="96" stroke="url(#ringGrad)" stroke-width="7" opacity="0.35" filter="url(#bigGlow)"/>
    <ellipse cx="1225" cy="250" rx="268" ry="96" stroke="url(#ringGrad)" stroke-width="6.5" opacity="0.95"/>
  </g>
  <g transform="rotate(26 1225 255)" fill="none">
    <ellipse cx="1225" cy="255" rx="205" ry="68" stroke="#22D3EE" stroke-width="2" opacity="0.55" stroke-dasharray="14 10"/>
  </g>

  <!-- floor bounce light under sculpture -->
  <ellipse cx="1235" cy="372" rx="240" ry="30" fill="url(#floorBounce)"/>

  <!-- isometric slab stack -->
  <!-- bottom slab -->
  <g>
    <polygon points="1230,196 1348,252 1230,308 1112,252" fill="url(#topFace1)" stroke="#818CF8" stroke-width="1.6" stroke-opacity="0.65"/>
    <polygon points="1112,252 1230,308 1230,352 1112,296" fill="#0B1224" stroke="#312E81" stroke-width="1.4"/>
    <polygon points="1348,252 1230,308 1230,352 1348,296" fill="#111B36" stroke="#3730A3" stroke-width="1.4"/>
    <line x1="1112" y1="252" x2="1230" y2="308" stroke="#67E8F9" stroke-width="1.6" opacity="0.55"/>
  </g>
  <!-- middle slab -->
  <g>
    <polygon points="1268,140 1358,182 1268,224 1178,182" fill="url(#topFace2)" stroke="#C084FC" stroke-width="1.6" stroke-opacity="0.6"/>
    <polygon points="1178,182 1268,224 1268,258 1178,216" fill="#0D1329" stroke="#4C1D95" stroke-width="1.4"/>
    <polygon points="1358,182 1268,224 1268,258 1358,216" fill="#151D3D" stroke="#5B21B6" stroke-width="1.4"/>
    <line x1="1178" y1="182" x2="1268" y2="224" stroke="#C4B5FD" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- top slab -->
  <g>
    <polygon points="1176,92 1240,122 1176,152 1112,122" fill="url(#topFace3)" stroke="#67E8F9" stroke-width="1.5" stroke-opacity="0.65"/>
    <polygon points="1112,122 1176,152 1176,180 1112,150" fill="#0A1526" stroke="#164E63" stroke-width="1.3"/>
    <polygon points="1240,122 1176,152 1176,180 1240,150" fill="#10203C" stroke="#1E40AF" stroke-width="1.3"/>
  </g>

  <!-- glass sphere -->
  <g>
    <circle cx="1408" cy="158" r="38" fill="url(#sphere)" filter="url(#softGlow)"/>
    <circle cx="1396" cy="144" r="7" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="1408" cy="204" rx="26" ry="6" fill="#6366F1" opacity="0.35" filter="url(#bigGlow)"/>
  </g>

  <!-- small floating iso cubes -->
  <g opacity="0.92">
    <polygon points="1022,96 1052,110 1022,124 992,110" fill="#22D3EE" opacity="0.85"/>
    <polygon points="992,110 1022,124 1022,146 992,132" fill="#0E7490"/>
    <polygon points="1052,110 1022,124 1022,146 1052,132" fill="#155E75"/>
  </g>
  <g opacity="0.92">
    <polygon points="1476,338 1502,350 1476,362 1450,350" fill="#A855F7" opacity="0.85"/>
    <polygon points="1450,350 1476,362 1476,382 1450,370" fill="#7C3AED"/>
    <polygon points="1502,350 1476,362 1476,382 1502,370" fill="#6D28D9"/>
  </g>
  <!-- small violet torus -->
  <circle cx="1096" cy="318" r="24" fill="none" stroke="#A855F7" stroke-width="5" opacity="0.8" filter="url(#softGlow)"/>

  <!-- node network accents -->
  <g stroke="#67E8F9" stroke-width="1.3" fill="#67E8F9" opacity="0.55">
    <line x1="1078" y1="70" x2="1148" y2="118"/>
    <line x1="1148" y1="118" x2="1222" y2="78"/>
    <line x1="1222" y1="78" x2="1305" y2="52"/>
    <circle cx="1078" cy="70" r="3.4"/>
    <circle cx="1148" cy="118" r="3.4"/>
    <circle cx="1222" cy="78" r="3.4"/>
    <circle cx="1305" cy="52" r="3.4"/>
  </g>
  <g stroke="#C084FC" stroke-width="1.3" fill="#C084FC" opacity="0.5">
    <line x1="1330" y1="420" x2="1418" y2="392"/>
    <line x1="1418" y1="392" x2="1508" y2="430"/>
    <circle cx="1330" cy="420" r="3.2"/>
    <circle cx="1418" cy="392" r="3.2"/>
    <circle cx="1508" cy="430" r="3.2"/>
  </g>

  <!-- vignette -->
  <rect width="1600" height="533" fill="url(#vignette)"/>
</svg>
